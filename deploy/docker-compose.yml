# STLab on the R730 — app + PostgreSQL + nightly backup
# Usage: docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_DB: stlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOTE: no ports exposed — only the app container reaches the DB.
    # Lab PCs and WiFi devices can never hit PostgreSQL directly.

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://stlab:${DB_PASSWORD}@db:5432/stlab
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      AGENT_API_KEY: ${AGENT_API_KEY:?set in .env}
    ports:
      - "3000:3000"   # LAN-facing; restrict further with ufw to lab subnets
    volumes:
      # Saved screen-recording JPEGs — must survive image rebuilds (the
      # Dockerfile recreates /app fresh each time) and must never be a bare
      # in-container folder, or "Save this session" data silently vanishes
      # on the next deploy.
      - screen_recordings:/app/var/screen-recordings
      # Student enrollment photos — same rebuild-survival requirement as
      # screen recordings above.
      - student_photos:/app/var/student-photos
      # Homework submission attachments — same rebuild-survival requirement.
      - assignment_attachments:/app/var/assignment-attachments

  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ../backups:/backups
      - ../scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]

volumes:
  pgdata:
  screen_recordings:
  student_photos:
  assignment_attachments:
